name: Create Recurring Tasks

on:
schedule:
- cron: '0 8 * * *'

workflow_dispatch:

jobs:
recurring:
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 22

  - run: npm install

  - run: node recurring-tasks.js
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      TASKS_DB_ID: ${{ secrets.TASKS_DB_ID }}
```
