name: Weekly Brief
on:
  schedule:
    - cron: "0 12 * * 0" # Every Sunday at 12 PM UTC (7 AM EST)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "18"
      - run: npm install
      - run: |
          echo "CALENDAR_DB_ID: $CALENDAR_DB_ID"
          echo "TASKS_DB_ID: $TASKS_DB_ID"
          echo "SERVICES_EVENTS_DB_ID: $SERVICES_EVENTS_DB_ID"
          echo "PROJECTS_DB_ID: $PROJECTS_DB_ID"
          echo "HOUSE_PROJECTS_DB_ID: $HOUSE_PROJECTS_DB_ID"
          echo "BRIEF_PAGE_ID: $BRIEF_PAGE_ID"
        env:
          CALENDAR_DB_ID: ${{ secrets.CALENDAR_DB_ID }}
          TASKS_DB_ID: ${{ secrets.TASKS_DB_ID }}
          SERVICES_EVENTS_DB_ID: ${{ secrets.SERVICES_EVENTS_DB_ID }}
          PROJECTS_DB_ID: ${{ secrets.PROJECTS_DB_ID }}
          HOUSE_PROJECTS_DB_ID: ${{ secrets.HOUSE_PROJECTS_DB_ID }}
          BRIEF_PAGE_ID: ${{ secrets.BRIEF_PAGE_ID }}
      - run: node recurring-tasks/weekly-brief.js
        env:
          NOTION_TOKEN: ${{ secrets.BRIEF_NOTION_TOKEN }}
          CALENDAR_DB_ID: ${{ secrets.CALENDAR_DB_ID }}
          TASKS_DB_ID: ${{ secrets.TASKS_DB_ID }}
          SERVICES_EVENTS_DB_ID: ${{ secrets.SERVICES_EVENTS_DB_ID }}
          PROJECTS_DB_ID: ${{ secrets.PROJECTS_DB_ID }}
          HOUSE_PROJECTS_DB_ID: ${{ secrets.HOUSE_PROJECTS_DB_ID }}
          BRIEF_PAGE_ID: ${{ secrets.BRIEF_PAGE_ID }}

          
